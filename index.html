<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="universal.css">
</head>

<body>
    <div class="spotify_container">
        <header class="navbar">

            <img src="logo.svg" alt="" class="invert trans">
            <div class="main">
                <div class="home">
                    <button class="nav-1 homes">
                        <img src="home.svg" alt="" class=" trans invert">
                    </button>


                    <div class="search-box">
                        <img width="20" src="search.svg" alt="" class="invert trans">
                        <input class="input" type="text" placeholder="What do you want to play?">
                    </div>
                    <img width="23" src="browser.svg" alt="" class="invert trans">
                </div>

                <div class="Install">
                    <button class="nav-2">Explore premium</button>
                    <div class="download">
                        <img width="15" src="download.svg" alt="" class="invert trans">
                        <span>Install App</span>
                    </div>
                </div>

            </div>
            <div class="icon">
                <button class="bell nav-1">
                    <img src="icon.svg" alt="" class="invert trans">
                </button>



                <button class="people nav-1">
                    <img src="community.svg" alt="" class="invert trans">
                </button>



                <button class="profile nav-1">
                    U
                </button>
            </div>

        </header>
    </div>
    <div class="left-sidebar">
        <div class="library">
            <span style="display: flex; background-color: #121212;">
                <img width="23" src="library.svg" alt="" class="invert trans">
                <h4 style="color: white;"> Your Library</h4>
            </span>
            <img width="25" src="plus.svg" alt="" class=" invert trans">
        </div>
        <div class="libsec">

            <img src="search.svg" alt="" class="invert trans">
            <div class="rightlib">
                <p style="color: white;">Recent</p>
                <img width="22" src="info.svg" alt="" class="invert trans">
            </div>
        </div>
        <h3 style="color: white; background-color: #121212;">Artists:</h3>
        <div class="Artists">
            <div class="headlogo" >
                <img   class="logo" src="https://th.bing.com/th/id/OIP.mNXYia1TeE3TKwy62DItmgHaHa?w=196&h=196&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="" width="35"> 
                    Guru Randhawa 
            </div>
            <div class="headlogo" > <img class="logo"  width="35" src="https://tellyflight.com/wp-content/uploads/2021/06/200253486_491412215456051_2541970781768209306_n-841x1024.jpg" alt=""><p> Tony Kakkar</p> </div>
            <div class="headlogo">  <img class="logo" width="35" src="https://th.bing.com/th/id/OIP.pitr5AVAZmJ2idaE7grDsgAAAA?w=237&h=187&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt=""><p>Jonita Gandhi</p> </div>
            <div class="headlogo"> <img class="logo" width="35" src="https://th.bing.com/th/id/OIP.df3rN_VaBlEJBnSaYECWoQHaHa?w=211&h=211&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt=""><p> Arijit Singh</p> </div>
            <div class="headlogo"><img class="logo" src="https://tse1.mm.bing.net/th/id/OIP.38gqe71A-trfrH-L_LebrAHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt=""> <p> Neha Kakkar</p> </div>
            <div class="headlogo"> <img class="logo" src="https://tse1.mm.bing.net/th/id/OIP.LM1pmeY0mAzBcCCJVX30BQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt=""><p> Jubin Nautiyal</p></div>
        </div>
    </div>
</body>

</html>
